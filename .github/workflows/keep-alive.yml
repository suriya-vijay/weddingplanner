# Keeps the Supabase project from being paused for inactivity.
#
# Supabase pauses FREE projects after ~7 days of low activity (a few requests a
# day is enough to stay active). This makes one tiny read EVERY DAY so the
# project never gets close to the pause window — even if GitHub delays or drops
# a scheduled run or two (which it does on quiet repos), a daily cadence against
# a 7-day window leaves plenty of margin. Cost: ~5 min/month of GitHub's free
# 2,000. Once real traffic arrives this is redundant but harmless; on a paid
# plan it's unnecessary (paid projects are never auto-paused).
#
# SETUP — add two repository secrets (Settings → Secrets and variables →
# Actions). Use the ANON key, never the service-role key:
#   SUPABASE_URL       = https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  = <the public anon key>
name: Supabase keep-alive

on:
  schedule:
    # 09:00 UTC every day. (A previous every-3-days cron left too big a gap once
    # GitHub's scheduler skipped a run — daily is the reliable choice.)
    - cron: "0 9 * * *"
  workflow_dispatch: # lets you run it by hand any time to verify

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          # A real (public, RLS-safe) read — dashboard visits alone don't count.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/inspiration_items?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded: HTTP $code"
          # 2xx = healthy. Anything else should fail loudly so the run goes red.
          case "$code" in
            2*) echo "Project is awake." ;;
            *)  echo "::error::Unexpected status $code"; exit 1 ;;
          esac
